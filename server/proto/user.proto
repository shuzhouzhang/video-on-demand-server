syntax = "proto3";

package vod.api;

import "base.proto";

message LoginRequest {
  string account = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string token = 3;
  UserInfo user = 4;
}

message GetProfileRequest {
  string account = 1;
}

message GetProfileResponse {
  bool success = 1;
  string message = 2;
  UserInfo user = 3;
}

service UserService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
}
