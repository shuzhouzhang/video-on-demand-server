syntax = "proto3";

package vod.api;

option cc_generic_services = true;

message RequestContext {
  string request_id = 1;
  string authenticated_account = 2;
  // 仅注销操作传递待撤销的会话；不得记录到日志。
  string session_token = 3;
}

message RpcStatus {
  int32 code = 1;
  string message = 2;
  string request_id = 3;
}

message UserInfo {
  string account = 1;
  string user_name = 2;
  string avatar_url = 3;
  string description = 4;
  string role = 5;
}

message FileInfo {
  string file_id = 1;
  string original_name = 2;
  string stored_path = 3;
  string public_url = 4;
  int64 size = 5;
  string storage_group = 6;
  string remote_name = 7;
  string mime_type = 8;
  string checksum_sha256 = 9;
  string bundle_id = 10;
}

message VideoInfo {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  string uploader = 5;
  string video_url = 6;
  string cover_url = 7;
  string review_status = 8;
  // 兼容历史数字 id；当前业务 ID 是 video-xxx，必须无损传递。
  string video_id = 9;
  string published_on = 10;
  uint64 duration_seconds = 11;
  string play_count = 12;
  string like_count = 13;
  repeated string tags = 14;
}

message BarrageInfo {
  int64 id = 1;
  int64 video_id = 2;
  string account = 3;
  string content = 4;
  int32 seconds = 5;
}
